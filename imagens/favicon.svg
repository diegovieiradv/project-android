<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a4c639;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8ab329;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Body -->
  <rect x="20" y="45" width="60" height="40" rx="8" fill="url(#grad)"/>
  <!-- Head -->
  <path d="M 25 45 Q 25 20 50 20 Q 75 20 75 45" fill="url(#grad)"/>
  <!-- Eyes -->
  <circle cx="38" cy="35" r="4" fill="#fff"/>
  <circle cx="62" cy="35" r="4" fill="#fff"/>
  <!-- Antennae -->
  <line x1="35" y1="20" x2="30" y2="10" stroke="#a4c639" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="20" x2="70" y2="10" stroke="#a4c639" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms -->
  <rect x="8" y="48" width="10" height="30" rx="5" fill="url(#grad)"/>
  <rect x="82" y="48" width="10" height="30" rx="5" fill="url(#grad)"/>
  <!-- Legs -->
  <rect x="32" y="85" width="12" height="15" rx="6" fill="url(#grad)"/>
  <rect x="56" y="85" width="12" height="15" rx="6" fill="url(#grad)"/>
</svg>